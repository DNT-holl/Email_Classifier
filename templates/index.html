<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📧 Hệ thống Phân loại Email</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        
        .header {
            text-align: center;
            color: white;
            margin-bottom: 30px;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        
        .card h2 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        textarea {
            width: 100%;
            height: 300px;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 14px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }
        
        textarea:focus {
            outline: none;
            border-color: #667eea;
        }
        
        .btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }
        
        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }
        
        .result {
            display: none;
        }
        
        .result.show {
            display: block;
            animation: fadeIn 0.5s;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .spam-result {
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
        }
        
        .spam-result.spam {
            background: #ffebee;
            border: 2px solid #f44336;
        }
        
        .spam-result.not-spam {
            background: #e8f5e9;
            border: 2px solid #4caf50;
        }
        
        .spam-result h3 {
            font-size: 1.8em;
            margin-bottom: 10px;
        }
        
        .spam-result.spam h3 {
            color: #c62828;
        }
        
        .spam-result.not-spam h3 {
            color: #2e7d32;
        }
        
        .confidence {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 10px;
        }
        
        .topic-result {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }
        
        .topic-result h3 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .topic-item {
            margin-bottom: 10px;
        }
        
        .topic-label {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-weight: 500;
        }
        
        .progress-bar {
            height: 25px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
        }
        
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #667eea 0%, #764ba2 100%);
            transition: width 0.5s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 12px;
            font-weight: bold;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }
        
        .loading {
            text-align: center;
            padding: 20px;
            color: #667eea;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📧 Hệ thống Phân loại Email</h1>
            <p>Phát hiện Spam & Phân loại Chủ đề tự động bằng AI</p>
        </div>
        
        <div class="main-content">
            <div class="card">
                <h2>📝 Nhập Email</h2>
                <textarea id="emailInput" placeholder="Nhập hoặc dán nội dung email của bạn tại đây..."></textarea>
                <button class="btn" onclick="analyzeEmail()">🔍 Phân tích Email</button>
            </div>
            
            <div class="card">
                <h2>📊 Kết quả Phân tích</h2>
                <div id="resultContainer">
                    <p style="color: #999; text-align: center; padding: 50px 20px;">
                        Nhập nội dung email và nhấn "Phân tích Email" để xem kết quả
                    </p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        async function analyzeEmail() {
            const emailText = document.getElementById('emailInput').value;
            const resultContainer = document.getElementById('resultContainer');
            const btn = document.querySelector('.btn');
            
            if (!emailText.trim()) {
                resultContainer.innerHTML = '<div class="error">⚠️ Vui lòng nhập nội dung email!</div>';
                return;
            }
            
            // Hiển thị loading
            btn.disabled = true;
            btn.textContent = '⏳ Đang phân tích...';
            resultContainer.innerHTML = '<div class="loading"><div class="spinner"></div><p>Đang phân tích email...</p></div>';
            
            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: emailText })
                });
                
                const data = await response.json();
                
                if (data.error) {
                    resultContainer.innerHTML = `<div class="error">❌ Lỗi: ${data.error}</div>`;
                    return;
                }
                
                // Hiển thị kết quả spam
                let html = `
                    <div class="spam-result ${data.is_spam ? 'spam' : 'not-spam'}">
                        <h3>${data.is_spam ? '🚫 SPAM' : '✅ Không phải Spam'}</h3>
                        <div class="confidence">Độ tin cậy: ${data.spam_confidence.toFixed(2)}%</div>
                    </div>
                `;
                
                // Nếu không phải spam, hiển thị chủ đề
                if (!data.is_spam && data.topic) {
                    html += `
                        <div class="topic-result">
                            <h3>📑 Phân loại Chủ đề</h3>
                            <p style="font-size: 1.2em; font-weight: bold; color: #667eea; margin-bottom: 15px;">
                                🎯 ${data.topic} (${data.topic_confidence.toFixed(2)}%)
                            </p>
                    `;
                    
                    if (data.all_topics) {
                        html += '<div style="margin-top: 20px;">';
                        for (const [topic, prob] of Object.entries(data.all_topics)) {
                            html += `
                                <div class="topic-item">
                                    <div class="topic-label">
                                        <span>${topic}</span>
                                        <span>${prob.toFixed(2)}%</span>
                                    </div>
                                    <div class="progress-bar">
                                        <div class="progress-fill" style="width: ${prob}%">${prob.toFixed(1)}%</div>
                                    </div>
                                </div>
                            `;
                        }
                        html += '</div>';
                    }
                    
                    html += '</div>';
                }
                
                resultContainer.innerHTML = html;
                
            } catch (error) {
                resultContainer.innerHTML = `<div class="error">❌ Lỗi kết nối: ${error.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = '🔍 Phân tích Email';
            }
        }
        
        // Cho phép nhấn Ctrl+Enter để phân tích
        document.getElementById('emailInput').addEventListener('keydown', function(e) {
            if (e.ctrlKey && e.key === 'Enter') {
                analyzeEmail();
            }
        });
    </script>
</body>
</html>
